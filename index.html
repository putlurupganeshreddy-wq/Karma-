<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KARMA</title><link rel="manifest" href="manifest-v2.webmanifest"><meta name="theme-color" content="#F8FAFC"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="icon" href="logo.png"><style>:root{--bg:#F8FAFC;--card:#fff;--tx:#1F2937;--tx2:#6B7280;--bd:#E5E7EB;--lav:#EDE9FE;--ac:#6D5BD0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 Georgia,'Iowan Old Style',serif;padding:0 0 84px}
h1,h2,h3,b,button,nav,small,label{font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.top{display:flex;gap:12px;align-items:center;padding:14px 18px;max-width:760px;margin:auto}.logo{width:46px;height:46px;border-radius:12px}.top small{display:block;color:var(--tx2)}
main{max-width:760px;margin:auto;padding:0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #1f29370a}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{text-align:center;padding:14px 6px}.stat b{font-size:26px;display:block}.stat small{color:var(--tx2)}
.big{width:100%;padding:18px;border:0;border-radius:16px;background:var(--ac);color:#fff;font-size:18px;font-weight:600;cursor:pointer}
button{font-size:15px;border:1px solid var(--bd);background:#fff;border-radius:12px;padding:10px 14px;cursor:pointer;color:var(--tx)}button.p{background:var(--ac);color:#fff;border:0}button.d{color:#B45309}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;font:inherit;margin:6px 0 12px;background:#fff}textarea{min-height:150px}
.quote{background:var(--lav);font-size:19px;font-style:italic}.time{color:var(--tx2);font-family:system-ui}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ai{background:#F5F9FF;border-left:4px solid #93C5FD}.mine{border-left:4px solid #86EFAC}.tag{font:12px system-ui;color:var(--tx2);display:block;margin-top:10px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fffE;backdrop-filter:blur(8px);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav a{flex:1;text-align:center;padding:12px 2px;color:var(--tx2);text-decoration:none;font-size:13px}nav a.on{color:var(--ac);font-weight:700}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 16px;border-radius:12px;font:14px system-ui;opacity:0;transition:.3s;pointer-events:none;max-width:90%}#toast.s{opacity:1}
img.ph{max-width:100%;border-radius:12px;margin:6px 0}audio{width:100%}.empty{text-align:center;color:var(--tx2);padding:40px 10px}
@media(min-width:900px){body{padding:0 0 0 200px}nav{top:0;bottom:auto;right:auto;width:200px;flex-direction:column;border:0;border-right:1px solid var(--bd);padding-top:90px}.top{position:fixed;left:0;top:0;width:200px;padding:14px}nav a{text-align:left;padding:12px 24px;font-size:15px}}
@media print{nav,.top,.noprint,#toast{display:none!important}body{padding:0;background:#fff}.pr-logo{display:block!important}}.pr-logo{display:none;width:60px;border-radius:12px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
#splash{position:fixed;inset:0;background:#F8FAFC;display:flex;align-items:center;justify-content:center;z-index:99}#splash img{width:140px;border-radius:30px}#pp{display:none}@media print{body.pp #pp{display:block}body.pp main{display:none!important}}nav a{font-size:12px}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script></head>
<body><div id="splash"><img class="lg" alt="KARMA"></div><header class="top"><img class="logo lg" alt="KARMA"><div><b>KARMA</b><small>Experiences, mistakes, moments and learning.</small></div></header><nav id="nav"></nav><main id="app"></main><div id="pp"></div><div id="toast" role="status"></div>
<script>'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS=['Study','Time Management','Discipline','Communication','Habits','Friends','Family','Money','Technology','Personal Growth','Other'];
const Q={Morning:['Every moment gives you another chance to choose differently.','A calm morning is a good place to begin again.','Small choices become habits.','Start gently; direction matters more than speed.','Today does not need to repeat yesterday.','Notice first. Everything else follows.','One honest look forward is enough for now.','Clarity grows in quiet minutes.','Begin with what you can control.','Learning is a quiet kind of progress.','Let the morning be lighter than your worries.','Choose one thing to do well today.','Growth begins when you honestly look at what happened.'],
Afternoon:['Pause. Reflect. Learn.','You can adjust course at any hour.','Steady effort beats perfect effort.','A small correction now saves a large one later.','Focus is a choice you can make again.','Progress is often quiet.','Take a breath; the rest of the day is still open.','What you learn today outlasts what you regret.','Be patient with the person you are becoming.','Attention is worth protecting.','Understanding comes before improvement.','Slow down enough to see clearly.','Every day holds room for a better decision.'],
Evening:['Learn from yesterday without carrying its weight.','Let the day settle; keep only what taught you something.','You do not have to write today to grow today.','Reflection is kindness toward your future self.','Honest is not the same as harsh.','What happened is information, not a verdict.','Rest is part of learning.','Look back gently, then look ahead.','A lesson learned is never wasted time.','Let go of what you cannot change; keep what you can use.','Evenings are for understanding, not judging.','You are allowed to be unfinished.','Awareness is already a step forward.'],
Night:['Rest well; tomorrow is a new page.','The day is done. What remains is what you learned.','Be gentle with yourself tonight.','Nothing needs solving before sleep.','Quiet minds see clearly in the morning.','Let the night carry the noise away.','You did what you could with what you knew.','Peace is a lesson too.','Sleep is a form of self-respect.','Carry the lesson, leave the weight.','Tomorrow will meet you as you are.','Stillness helps understanding settle.','Even slow days move you forward.']};
/* IndexedDB */
const DB=new Promise((ok,no)=>{const q=indexedDB.open('karma',2);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('e'))q.result.createObjectStore('e',{keyPath:'id'});if(!q.result.objectStoreNames.contains('d'))q.result.createObjectStore('d',{keyPath:'id'})};q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});
const tx=async(m,f,st='e')=>{const d=await DB;return new Promise((ok,no)=>{const t=d.transaction(st,m),q=f(t.objectStore(st));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error)})};
const all=()=>tx('readonly',s=>s.getAll()).then(a=>a.sort((x,y)=>y.at.localeCompare(x.at)));
const raw=()=>tx('readonly',s=>s.getAll()),put0=e=>tx('readwrite',s=>s.put(e)),del0=id=>tx('readwrite',s=>s.delete(id));
const put=async e=>{await put0(e);if(SB&&U&&U!=='local'&&!syncing)push(e).catch(()=>toast('Saved on this device. Cloud sync will retry when you are online.'))};
const del=async id=>{const e=await one(id);await del0(id);if(SB&&U&&U!=='local')cdel(id,e).catch(()=>{})};
const dall=()=>tx('readonly',s=>s.getAll(),'d'),dput=e=>tx('readwrite',s=>s.put(e),'d'),ddel=id=>tx('readwrite',s=>s.delete(id),'d');
const clr=async()=>{for(const e of await all())await del(e.id)};
const one=id=>tx('readonly',s=>s.get(id));
/* helpers */
const toast=m=>{const t=$('#toast');t.textContent=m;t.className='s';setTimeout(()=>t.className='',3500)};
const D=e=>new Date(e.at),fd=e=>D(e).toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'}),fw=e=>D(e).toLocaleDateString(undefined,{weekday:'long'}),ft=e=>D(e).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2);
const b2d=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
const d2b=d=>fetch(d).then(r=>r.blob());
const dl=(blob,name)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};
const period=h=>h>=5&&h<12?'Morning':h<17&&h>=12?'Afternoon':h>=17&&h<21?'Evening':'Night';
const QC={Discipline:['Discipline is choosing what matters over what is easy.','Small promises kept build large trust in yourself.','Do the next right thing, then the one after.'],Reflection:Object.values(Q).flat(),Learning:['Every experience is a teacher if you stay curious.','Learn from people, from places, and from your own days.','What you understand once, you can use for a lifetime.'],Growth:['Growth is quiet, and it counts even when unseen.','You are allowed to outgrow who you were.','Change begins with noticing.'],Focus:['Where attention goes, life follows.','One thing at a time is still progress.','Protect your focus as you would protect your time.'],Courage:['Courage is taking the next step while afraid.','Being honest with yourself takes real bravery.','Try it imperfectly rather than never at all.'],Peace:['Peace begins with accepting this moment.','Let what you cannot control pass through.','Stillness is not the absence of life; it is a way of living.'],'Self-awareness':['Knowing yourself is the beginning of every change.','Notice your patterns with kindness.','Your feelings are information, not instructions.'],Relationships:['People remember how you made them feel.','Listen to understand, not only to answer.','Good relationships are built in small moments.'],Life:['Life is made of moments worth keeping.','Gratitude turns what we have into enough.','Today is one page of a long story.'],Consistency:['Consistency beats intensity.','Small steps, repeated, become a path.','Show up gently, and keep showing up.']};
const ALLQ=Object.values(QC).flat(),today=()=>new Date().toLocaleDateString('en-CA');
function quote(){const t=today();let s;try{s=JSON.parse(localStorage.kqd||'null')}catch(e){}if(s&&s.date===t)return s.text;let x;do{x=ALLQ[Math.floor(Math.random()*ALLQ.length)]}while(s&&x===s.text);localStorage.kqd=JSON.stringify({date:t,text:x});return x}
/* Local reflection engine: uses only the user's own words (no external AI needed). */
const RULES=[[/phone|scroll|social media|youtube|game/i,'I let a distraction take over time I had planned for something else.','Having a plan is not enough; I also need to protect my focus.','Small distractions can use far more time than I expect.','I will put the distraction out of reach before I start.'],
[/late|deadline|forgot|missed|procrastinat|delay/i,'I let time slip past something that mattered.','I realized that waiting made the task harder, not easier.','Starting early gives me room to handle surprises.','I will set a reminder and start the first small step right away.'],
[/said|shout|yell|argu|angry|rude|snapped|fight/i,'I reacted in the moment instead of responding thoughtfully.','I realized my words landed harder than I intended.','A short pause can change how a conversation ends.','I will pause and take one breath before I reply.'],
[/spent|bought|money|paid|wasted/i,'I made a spending decision without thinking it through.','I realized I decided quickly and only later noticed the cost.','A short wait before spending helps me choose well.','I will wait 24 hours before buying anything non-essential.']];
function reflectM(t,title){const s=(t.match(/[^.!?\n]+[.!?]?/)||[t])[0].trim().slice(0,220);const r=RULES.find(x=>x[0].test(t+' '+title));
return{whatHappened:s?`I recorded: "${s}"`:`I recorded "${title}".`,myMistake:r?r[1]:`The decision or action I described in "${title||'this entry'}" did not go the way I wanted.`,realization:r?r[2]:'I realized that looking honestly at what happened helps me understand it.',lesson:r?r[3]:'Noticing a mistake early makes it easier to handle differently next time.',nextTime:r?r[4]:'Next time, I will pause and ask what I want the outcome to be before I act.',createdAt:new Date().toISOString(),generated:'local'}}
const url=b=>URL.createObjectURL(b);
const empty=m=>`<div class="empty">${m}</div>`;

const TY={mistake:['🔥','Mistake','#FEF3C7','Mistake'],learning:['📚','Learning','#E0F2FE','Learning from someone'],happy:['😊','Happy moment','#FEF9C3','Happy moment'],sad:['🌧','Sad moment','#EDE9FE','Sad moment'],experience:['⭐','Experience','#FCE7F3','Important experience'],realization:['💡','Realization','#DCFCE7','Personal realization'],other:['📝','Other','#F3F4F6','Other']};
const W=s=>`I recorded: "${s}"`,M=s=>`I want to remember: "${s}"`;
const G={learning:[['What did I observe?',s=>`I noticed: "${s}"`],['What did I learn?','Watching how others act can teach me something I can use.'],['Why was it meaningful?','It stayed with me enough that I wanted to write it down.'],['How can I apply it?','I will pick one small thing from this and try it in my own life this week.']],
happy:[['What happened?',W],['Why was it meaningful?','It mattered enough that I wanted to keep it.'],['What do I want to remember?',M],['What am I grateful for?','I am grateful I got to experience this moment.']],
sad:[['What happened?',W],['What am I feeling or experiencing?','I am going through something difficult, and that is okay.'],['What did I learn?','Writing it down helps me understand it a little more.'],['What might help me move forward?','Being patient with myself, and talking with someone I trust if I want to.']],
experience:[['What happened?',W],['Why was it important?','It felt significant enough to record.'],['What did I learn?','Paying attention to important moments helps me see what matters to me.'],['What do I want to remember?',M]],
realization:[['What did I realize?',s=>`"${s}"`],['Why does it matter?','It shows me something about how I think or what I value.'],['What will I change or remember?','I will keep this in mind and come back to it when it is relevant.']]};
G.other=G.experience;const RI={learning:1,happy:2,sad:2,experience:2,realization:0,other:2},LI={learning:1,sad:2,experience:2,other:2};
function reflect(t,title,type){if(!type||type==='mistake')return reflectM(t,title);const s=(t.match(/[^.!?\n]+[.!?]?/)||[''])[0].trim().slice(0,220)||title,it=(G[type]||G.experience).map(([l,v])=>[l,typeof v==='function'?v(s):v]);return{type,items:it,realization:it[RI[type]??2][1],...(LI[type]!=null?{lesson:it[LI[type]][1]}:{}),createdAt:new Date().toISOString(),generated:'local'}}
const items=r=>r.items||[['What happened',r.whatHappened],['My mistake',r.myMistake],['Realization',r.realization],['Lesson',r.lesson],['Next time',r.nextTime]];
const tl=e=>{const t=TY[e.type||'mistake'];return t[0]+' '+t[1]};
const fdD=d=>new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const mv=e=>(e.voice?`<div>🎙<audio controls src="${url(e.voice.blob)}"></audio><a download="voice" href="${url(e.voice.blob)}">Download</a>${e.voice.transcript?`<p><small>Voice transcript</small><br>${esc(e.voice.transcript)}</p>`:''}</div>`:'')+(e.photos||[]).map(p=>`<div><img class="ph" src="${url(p.blob)}"><br><a download="${esc(p.name)}" href="${url(p.blob)}">Download</a></div>`).join('')+(e.pdfs||[]).map(p=>`<div>📄 <a target="_blank" href="${url(p.blob)}">${esc(p.name)}</a> · <a download="${esc(p.name)}" href="${url(p.blob)}">Download</a></div>`).join('');
/* views */
const mediaUI=d=>`<div class="card"><b>🎙 Voice</b><div class="row"><button onclick="rec('start')">Start</button><button onclick="rec('pause')">Pause</button><button onclick="rec('resume')">Resume</button><button onclick="rec('stop')">Stop</button><button class="d" onclick="draft.voice=null;$('#va').innerHTML=''">Delete</button></div><div id="va">${d.voice?`<audio controls src="${url(d.voice.blob)}"></audio>`:''}</div><small id="rs"></small>
<label>Voice transcript (type or paste; not auto-generated unless a speech service is connected)</label><textarea id="tr" style="min-height:60px">${esc(d.voice?.transcript)}</textarea></div>
<div class="card"><b>📷 Photos</b><input type="file" accept="image/*" multiple onchange="addF(this,'photos')"><div id="pl"></div><b>📄 PDFs</b><input type="file" accept="application/pdf" multiple onchange="addF(this,'pdfs')"><div id="dl"></div></div>`;
const V={};let list=[];
V.home=async()=>{const n=new Date(),rl=list.filter(e=>e.reflection).length,ls=list.filter(e=>e.reflection?.lesson).length;return`<div class="card"><div class="time"><h1 style="margin:0;color:var(--tx)">${n.toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'})}</h1>${n.toLocaleDateString(undefined,{weekday:'long'})} · ${n.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</div></div>
<div class="card quote">“${esc(quote())}”</div><button class="big" onclick="location.hash='#capture'">✨ + Capture a moment</button>
<h2>Your journey</h2><div class="grid"><div class="card stat" style="background:#FEF3C7"><b>${list.length}</b><small>Experiences</small></div><div class="card stat" style="background:#DCFCE7"><b>${rl}</b><small>Realizations</small></div><div class="card stat" style="background:#E0F2FE"><b>${ls}</b><small>Lessons</small></div></div>
<h2>Recent moments</h2>${list.slice(0,4).map(e=>card(e)).join('')||empty('Nothing captured yet.<br>Your first moment will appear here when you are ready.')}`};
V.capture=async()=>`<h1>What do you want to record?</h1>${Object.entries(TY).map(([k,t])=>`<div class="card" style="background:${t[2]}99;cursor:pointer;font-size:18px" onclick="location.hash='#new/t-${k}'">${t[0]} <b>${t[3]}</b></div>`).join('')}`;
const media=e=>[e.voice?'🎙':'',e.photos?.length?'📷':'',e.pdfs?.length?'📄':''].join(' ');
const card=(e,s)=>{const t=TY[e.type||'mistake'];return`<div class="card" style="background:${t[2]}55">${s?`<label style="float:right"><input type="checkbox" class="sel" value="${e.id}" style="width:auto;margin:0"></label>`:''}<span class="tag" style="margin:0">${t[0]} ${t[1]}</span><b>${e.fav?'★ ':''}${esc(e.title||'Untitled')}</b><div class="time">${fd(e)} · ${fw(e)} · ${ft(e)} ${media(e)}</div><p>${esc(e.text.slice(0,140))}${e.text.length>140?'…':''}</p><div class="row"><button onclick="location.hash='#entry/${e.id}'">Open</button><button onclick="location.hash='#new/${e.id}'">Edit</button><button onclick="fav('${e.id}')">${e.fav?'Unfavorite':'Favorite'}</button><button class="d" onclick="rm('${e.id}')">Delete</button></div></div>`};
const hay=e=>[e.title,e.text,e.voice?.transcript,e.category,e.reflection?.realization,e.reflection?.lesson,fd(e),fw(e)].join(' ').toLowerCase();
const TABS=[['all','All'],['mistake','Mistakes'],['learning','Learning'],['happy','Happy'],['sad','Sad'],['experience','Experiences'],['realization','Realizations']];
const realCard=e=>`<div class="card" style="background:#DCFCE788;cursor:pointer" onclick="location.hash='#entry/${e.id}'"><span class="tag" style="margin:0">💡 ${esc(e.title)} · ${fd(e)}</span><span class="tag">REALIZATION</span>${esc(e.reflection.realization||'')}${e.reflection.lesson?`<span class="tag">LESSON</span>${esc(e.reflection.lesson)}`:''}</div>`;
V.mistakes=async()=>{const q=(sessionStorage.q||'').toLowerCase(),c=sessionStorage.c||'',f=sessionStorage.f,tb=sessionStorage.tab||'all';const r=list.filter(e=>(tb==='all'||tb==='realization'||(e.type||'mistake')===tb||(tb==='experience'&&e.type==='other'))&&(!q||hay(e).includes(q))&&(!c||e.category===c)&&(!f||e.fav));
return`<h1>Mistakes</h1><div class="row" style="overflow-x:auto;flex-wrap:nowrap">${TABS.map(([k,l])=>`<button class="${k===tb?'p':''}" style="white-space:nowrap" onclick="sessionStorage.tab='${k}';go()">${l}</button>`).join('')}</div><input id="q" placeholder="Search everything…" value="${esc(sessionStorage.q||'')}" oninput="sessionStorage.q=this.value;go(true)"><select onchange="sessionStorage.c=this.value;go()"><option value="">All categories</option>${CATS.map(x=>`<option ${x===c?'selected':''}>${x}</option>`).join('')}</select><label><input type="checkbox" style="width:auto" ${f?'checked':''} onchange="sessionStorage.f=this.checked?1:'';go()"> Favorites only</label><div class="row noprint" style="margin-bottom:8px"><button onclick="pdf('sel')">Download selected as PDF</button></div>${(tb==='realization'?r.filter(e=>e.reflection).map(realCard):r.map(e=>card(e,1))).join('')||empty(list.length?'Nothing matches here yet.':'No moments captured yet.<br>Your first reflection will appear here when you are ready.')}`};
V.realize=async()=>{const r=list.filter(e=>e.reflection);return`<h1>Realize</h1>${r.map(e=>`<div class="card" onclick="location.hash='#entry/${e.id}'" style="cursor:pointer"><span class="time">${fd(e)} · ${ft(e)}</span><span class="tag">MISTAKE</span><b>${esc(e.title)}</b><span class="tag">REALIZATION</span>${esc(e.reflection.realization)}<span class="tag">LESSON</span>${esc(e.reflection.lesson)}<span class="tag">NEXT TIME</span>${esc(e.reflection.nextTime)}</div>`).join('')||empty('Your realizations will appear here after you record an experience.')}`};
V.diary=async()=>{const de=(await dall()).sort((x,y)=>y.date.localeCompare(x.date)),sel=sessionStorage.dd||today(),cur=de.find(e=>e.date===sel);
return`<h1>Diary</h1><div class="card noprint"><label>Date</label><input type="date" value="${sel}" onchange="if(this.value){sessionStorage.dd=this.value;go()}"></div>${cur?`<div class="card mine"><span class="tag">${fdD(sel)}</span><p><i>Dear Diary,</i></p><p style="white-space:pre-wrap">${esc(cur.text)}</p>${mv(cur)}<div class="row noprint"><button onclick="location.hash='#write/${sel}'">Edit</button><button onclick="window.print()">Download as PDF</button><button class="d" onclick="rd('${cur.id}')">Delete</button></div></div>`:`<div class="empty">No diary entry for this date.<br><br><button class="p" onclick="location.hash='#write/${sel}'">Write diary entry</button></div>`}<h3 class="noprint">All diary entries</h3><div class="noprint">${de.map(e=>`<div class="card" style="cursor:pointer" onclick="sessionStorage.dd='${e.date}';go();scrollTo(0,0)"><b>${fdD(e.date)}</b><div class="time">${esc(e.text.slice(0,80))}</div></div>`).join('')||empty('Your KARMA diary is empty.')}</div>`};
V.write=async date=>{const old=(await dall()).find(e=>e.date===date);draft=old?{...old,photos:[...(old.photos||[])],pdfs:[...(old.pdfs||[])]}:{id:'diary-'+date,date,photos:[],pdfs:[],voice:null,text:''};const d=draft;
return`<h1>Write in diary</h1><div class="card"><span class="tag">WRITE FOR:</span><b>${fdD(date)}</b></div><div class="card mine"><i>Dear Diary,</i><textarea id="x" style="min-height:260px">${esc(d.text)}</textarea></div>${mediaUI(d)}<div class="row"><button class="big" onclick="saveD()">Save diary entry</button><button onclick="history.back()">Cancel</button></div>`};
window.saveD=async()=>{const d=draft,x=$('#x').value;if(!x.trim()&&!d.photos.length&&!d.voice&&!d.pdfs.length)return toast('Write something first.');const now=new Date().toISOString();if(d.voice)d.voice.transcript=$('#tr').value;try{await dput({...d,text:x,updatedAt:now,createdAt:d.createdAt||now});sessionStorage.dd=d.date;toast('Diary entry saved.');location.hash='#diary'}catch(e){toast('Could not save. Your device storage may be full.')}};
window.rd=async id=>{if(confirm('Delete this diary entry permanently?')){await ddel(id);go()}};
V.entry=async id=>{const e=await one(id);if(!e)return empty('Entry not found.');const r=e.reflection;
return`<img class="pr-logo" src="${LOGO}" alt="KARMA"><h1>${esc(e.title)}</h1><span class="tag">${tl(e)}</span><div class="time">${fd(e)}<br>${fw(e)} · ${ft(e)}${e.category?' · '+esc(e.category):''}</div>
<div class="card mine"><span class="tag">${(TY[e.type||'mistake'][1]).toUpperCase()} · WRITTEN BY ME</span><p style="white-space:pre-wrap">${esc(e.text)}</p></div>
${e.voice||e.photos?.length||e.pdfs?.length?`<div class="card"><span class="tag">ATTACHMENTS</span>${mv(e)}</div>`:''}
${r?`<div class="card ai"><span class="tag">GENERATED REFLECTION</span>${items(r).map(([l,t])=>`<span class="tag">${esc(l.toUpperCase())}</span>${esc(t)}`).join('')}</div>`:''}
<div class="row noprint"><button onclick="window.print()">Export this entry as PDF</button><button onclick="location.hash='#new/${e.id}'">Edit</button><button onclick="fav('${e.id}')">${e.fav?'Unfavorite':'Favorite'}</button><button class="d" onclick="rm('${e.id}')">Delete</button></div>`};
let draft;
V.new=async id=>{const old=id&&await one(id);draft=old?{...old,type:old.type||'mistake',photos:[...(old.photos||[])],pdfs:[...(old.pdfs||[])]}:{id:uid(),type:(TY[String(id).slice(2)]?String(id).slice(2):'mistake'),photos:[],pdfs:[],voice:null};window.old=old;const d=draft;
return`<h1>${TY[d.type][0]} ${old?'Edit':'Capture'}: ${TY[d.type][1]}</h1><div class="card"><label>Title</label><input id="t" value="${esc(d.title)}"><label>What happened?</label><textarea id="x">${esc(d.text)}</textarea><label>Category (optional)</label><select id="c"><option value="">None</option>${CATS.map(x=>`<option ${x===d.category?'selected':''}>${x}</option>`).join('')}</select><label>Additional notes (optional)</label><textarea id="n" style="min-height:70px">${esc(d.notes)}</textarea></div>
${mediaUI(d)}
<div class="row"><button class="big" onclick="save()">Save mistake</button><button onclick="history.back()">Cancel</button></div>`};
let mr,chunks=[];
window.rec=async a=>{try{if(a==='start'){const s=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];mr=new MediaRecorder(s);mr.ondataavailable=e=>chunks.push(e.data);mr.onstop=()=>{s.getTracks().forEach(t=>t.stop());const b=new Blob(chunks,{type:mr.mimeType});draft.voice={blob:b,transcript:draft.voice?.transcript||''};$('#va').innerHTML=`<audio controls src="${url(b)}"></audio>`;$('#rs').textContent='Recording saved to this entry.'};mr.start();$('#rs').textContent='Recording…'}else if(mr){a==='pause'&&mr.state==='recording'&&mr.pause();a==='resume'&&mr.state==='paused'&&mr.resume();a==='stop'&&mr.state!=='inactive'&&mr.stop()}}catch(e){toast('Microphone unavailable. Please allow microphone access in your browser settings.')}};
window.addF=async(i,k)=>{for(const f of i.files){if(f.size>25e6){toast(f.name+' is larger than 25 MB.');continue}draft[k].push({id:uid(),name:f.name,blob:f})}i.value='';drawF()};
const drawF=()=>{$('#pl').innerHTML=draft.photos.map((p,i)=>`<div><img class="ph" style="max-height:140px" src="${url(p.blob)}"><button onclick="draft.photos.splice(${i},1);drawF()">Remove</button></div>`).join('');$('#dl').innerHTML=draft.pdfs.map((p,i)=>`<div>📄 <a target="_blank" href="${url(p.blob)}">${esc(p.name)}</a> ${(p.blob.size/1024).toFixed(0)} KB <button onclick="draft.pdfs.splice(${i},1);drawF()">Remove</button></div>`).join('')};
window.save=async()=>{const t=$('#t').value.trim(),x=$('#x').value;if(!t&&!x.trim())return toast('Add a title or describe what happened first.');const now=new Date().toISOString();
const e={...draft,title:t||x.trim().slice(0,50),text:x,notes:$('#n').value,category:$('#c').value,updatedAt:now,owner:U,at:old_at(),createdAt:draft.createdAt||now};
if(e.voice)e.voice.transcript=$('#tr').value;
if(!e.reflection||e.text!==window.old?.text||e.type!==window.old?.type)e.reflection=reflect(e.text+' '+e.notes,e.title,e.type);
try{await put(e);toast('Mistake saved.');location.hash='#entry/'+e.id}catch(er){toast('Could not save. Your browser storage may be full.')}};
const old_at=()=>window.old?.at||new Date().toISOString();
window.fav=async id=>{const e=await one(id);e.fav=!e.fav;await put(e);go()};
window.rm=async id=>{if(confirm('Delete this entry permanently?')){await del(id);location.hash='#mistakes';go()}};
/* Data */
const cnt=(A,k)=>A.reduce((n,e)=>n+(k==='v'?(e.voice?1:0):(e[k]||[]).length),0);
async function stor(){const de=await dall(),A=[...list,...de];let u='n/a';try{u=((await navigator.storage.estimate()).usage/1048576).toFixed(1)+' MB'}catch(e){}return`<div class="card"><b>KARMA storage (this device)</b><p class="time">Entries stored: ${list.length}<br>Diary entries: ${de.length}<br>Photos: ${cnt(A,'photos')}<br>Voice recordings: ${cnt(A,'v')}<br>PDFs: ${cnt(A,'pdfs')}<br>Storage used: ${u}</p></div>`}
V.data=async()=>`<h1>Data</h1>${await stor()}<div class="card"><b>Backup &amp; export</b><p>Everything you created (experiences, reflections, diary, photos, voice, PDFs) in one .karma.zip file.</p><button class="p" onclick="exp()">Backup KARMA / Export all data</button></div>
<div class="card"><b>Import KARMA backup</b><p>Choose a .karma.zip (or older .karma.json) backup.</p><input type="file" accept=".zip,.json" onchange="prev(this)"><div id="ip"></div></div>
<div class="card"><b>Download as PDF</b><div class="row"><button onclick="pdf('all')">Complete KARMA journal</button><button onclick="pdf('exp')">All experiences</button><button onclick="pdf('diary')">All diary entries</button></div><p class="time">To download selected entries, tick them in the Mistakes section. Original photos, voice and PDFs can be downloaded from each entry.</p></div>
<div class="card"><b>Delete all data</b><p class="time">Removes everything on this device. Back up first.</p><button class="d" onclick="wipe()">Delete all data</button></div>`;
const ext=t=>(t||'').split('/')[1]?.split(';')[0]||'bin';
const pk=(z,e,dir)=>{const x={...e};delete x.owner;const f=(d,n,b)=>{const p=`${dir}/${d}/${e.id}-${n}`;z.file(p,b);return p};x.voice=e.voice&&{transcript:e.voice.transcript,type:e.voice.blob.type,file:f('audio','voice.'+ext(e.voice.blob.type),e.voice.blob)};x.photos=(e.photos||[]).map(p=>({id:p.id,name:p.name,type:p.blob.type,file:f('images',p.id+'-'+p.name,p.blob)}));x.pdfs=(e.pdfs||[]).map(p=>({id:p.id,name:p.name,file:f('pdfs',p.id+'-'+p.name,p.blob)}));return x};
window.exp=async()=>{try{if(!window.JSZip)throw 0;const z=new JSZip(),de=await dall();z.file('karma.json',JSON.stringify({format:'karma-backup',version:3,exportedAt:new Date().toISOString(),entries:list.map(e=>pk(z,e,'media')),diary:de.map(e=>pk(z,e,'diary'))}));dl(await z.generateAsync({type:'blob'}),`KARMA_Backup_${today()}.karma.zip`);toast('Your KARMA data has been exported successfully.')}catch(e){toast('Export failed. Please check your connection and try again.')}};
let pend;
window.prev=async i=>{const f=i.files[0];if(!f)return;try{let j,z=null;if(/\.zip$/i.test(f.name)){z=await JSZip.loadAsync(f);j=JSON.parse(await z.file('karma.json').async('string'))}else j=JSON.parse(await f.text());if(j.format!=='karma-backup'||![1,2,3].includes(j.version)||!Array.isArray(j.entries))throw 0;pend={j,z};const A=[...j.entries,...(j.diary||[])];
$('#ip').innerHTML=`<h3>Import KARMA backup</h3><p>${j.entries.length} experiences<br>${(j.diary||[]).length} diary entries<br>${j.entries.filter(e=>e.reflection).length} realizations<br>${cnt(A,'photos')} images · ${cnt(A,'v')} audio files · ${cnt(A,'pdfs')} PDFs</p><label><input type="radio" name="m" value="merge" checked style="width:auto"> Merge with existing data (skips duplicates)</label><br><label><input type="radio" name="m" value="replace" style="width:auto"> Replace existing data</label><div class="row"><button onclick="$('#ip').innerHTML='';pend=null">Cancel</button><button class="p" onclick="imp()">Import</button></div>`}catch(e){toast('Unable to import this file. Please select a valid KARMA backup.')}};
window.imp=async()=>{const m=document.querySelector('[name=m]:checked').value;if(m==='replace'&&!confirm('This will replace your current KARMA data. Export a backup first if you want to keep it.'))return;
try{const{j,z}=pend,de=await dall(),bl=async(o,t)=>z?new Blob([await z.file(o.file).async('arraybuffer')],{type:o.type||t||''}):d2b(o.data),mk=async e=>({...e,owner:U,voice:e.voice?{transcript:e.voice.transcript,blob:await bl(e.voice)}:null,photos:await Promise.all((e.photos||[]).map(async p=>({id:p.id,name:p.name,blob:await bl(p)}))),pdfs:await Promise.all((e.pdfs||[]).map(async p=>({id:p.id,name:p.name,blob:await bl(p,'application/pdf')})))}),ex=new Set(list.map(e=>e.id)),dx=new Set(de.map(e=>e.id)),o1=[],o2=[];
for(const e of j.entries)if(m==='replace'||!ex.has(e.id))o1.push({...await mk(e),type:e.type||'mistake'});for(const e of j.diary||[])if(m==='replace'||!dx.has(e.id))o2.push(await mk(e));
if(m==='replace'){await clr();for(const d of de)await ddel(d.id)}for(const e of o1)await put(e);for(const e of o2)await dput(e);toast('Your KARMA data has been restored successfully.');go()}catch(e){toast('Import failed. Your existing data was not changed.')}};
const pe=(e,dy)=>{const t=dy?['📔','Diary']:TY[e.type||'mistake'],r=e.reflection;return`<div style="page-break-inside:avoid;margin:0 0 22px;padding-bottom:14px;border-bottom:1px solid #ddd"><small>${t[0]} ${t[1]} · ${dy?fdD(e.date):fd(e)+' · '+fw(e)+' · '+ft(e)}</small><h2>${esc(dy?'Dear Diary':e.title)}</h2><p style="white-space:pre-wrap">${esc(e.text)}</p>${(e.photos||[]).map(p=>`<img src="${url(p.blob)}" style="max-width:100%;max-height:300px">`).join('')}${r?items(r).map(([l,x])=>`<p><b>${esc(l)}</b><br>${esc(x)}</p>`).join(''):''}</div>`};
window.pdf=async k=>{const de=await dall();let a=[];if(k==='sel'){const ids=[...document.querySelectorAll('.sel:checked')].map(x=>x.value);if(!ids.length)return toast('Tick the entries you want in the list first.');a=list.filter(e=>ids.includes(e.id)).map(e=>[e.at,pe(e)])}else{if(k!=='diary')a.push(...list.map(e=>[e.at,pe(e)]));if(k!=='exp')a.push(...de.map(e=>[e.date+'T'+(e.createdAt||'').slice(11),pe(e,1)]))}
if(!a.length)return toast('Nothing to download yet.');a.sort((x,y)=>x[0].localeCompare(y[0]));const p=$('#pp');p.innerHTML=`<img src="${LOGO}" style="width:70px;border-radius:14px"><h1>KARMA</h1>`+a.map(x=>x[1]).join('');document.body.classList.add('pp');await Promise.all([...p.querySelectorAll('img')].map(i=>i.decode().catch(()=>{})));window.print();setTimeout(()=>{document.body.classList.remove('pp');p.innerHTML=''},1500)};
window.wipe=async()=>{if(confirm('Delete ALL your KARMA data, including your account copy? This cannot be undone.')&&confirm('Really delete everything? Export a backup first if unsure.')){await clr();for(const d of await dall())await ddel(d.id);toast('All data deleted.');go()}};
/* router */
const NAV=[['home','🏠 Home'],['mistakes','🧭 Mistakes'],['diary','📔 Diary'],['data','💾 Data']];
window.go=async keep=>{const[h,id]=(location.hash.slice(1)||'home').split('/');list=await all();const v=V[h]||V.home;$('#nav').innerHTML=NAV.map(([k,l])=>`<a href="#${k}" class="${k===h?'on':''}">${l}</a>`).join('');
const y=scrollY,f=document.activeElement?.id==='q';$('#app').innerHTML=await v(id);if(keep){scrollTo(0,y);if(f){const q=$('#q');q.focus();q.setSelectionRange(q.value.length,q.value.length)}}else scrollTo(0,0);drawF&&$('#pl')&&drawF()};


/* ===== startup (local device storage only; never resets data) ===== */
const LOGO='logo.png';let U='local',SB=null,syncing=false;
async function boot(){document.querySelectorAll('.lg').forEach(i=>i.src=LOGO);document.querySelector('link[rel=icon]').href=LOGO;try{navigator.storage?.persist?.()}catch(e){}
for(const e of await raw()){let c=0;if(!e.type){e.type='mistake';c=1}if(!e.owner){e.owner='local';c=1}if(c)await put0(e)}
setTimeout(()=>$('#splash')?.remove(),600);addEventListener('hashchange',()=>go());go()}
boot();
</script>
<script>if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js?v=4').catch(()=>{}));let dp;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;const b=document.createElement('button');b.textContent='Install KARMA app';b.className='p';b.style.cssText='position:fixed;right:14px;top:14px;z-index:9;padding:12px 16px;border-radius:14px';b.onclick=async()=>{dp.prompt();await dp.userChoice;b.remove()};document.body.appendChild(b)})</script></body></html>
